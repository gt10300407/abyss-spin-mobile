<style>
:root{
  color-scheme:dark;
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bottom: env(safe-area-inset-bottom,0px);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#020617;color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:flex-start;background:radial-gradient(circle at 50% 0%,#083344 0,#041521 32%,#020617 74%)}
button{font:inherit;color:inherit;touch-action:manipulation}
#app{width:var(--game-w);min-height:100dvh;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
.machine{position:relative;min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% -10%,#0b4a65 0,#06283a 27%,#031522 55%,#01070e 100%);border-left:1px solid rgba(125,211,252,.08);border-right:1px solid rgba(125,211,252,.08)}

.header{position:relative;z-index:3;padding:10px 12px 7px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.64),transparent)}
.brand small{display:block;font-size:8px;letter-spacing:.25em;color:#67e8f9}.brand b{font-size:clamp(18px,5vw,22px);letter-spacing:.08em;text-shadow:0 0 13px #0891b2}
.wallet{text-align:right}.wallet small{display:block;font-size:8px;letter-spacing:.12em;color:#94a3b8}.wallet strong{display:block;font-size:clamp(22px,6vw,27px);line-height:1;color:#fde68a;text-shadow:0 0 12px rgba(250,204,21,.35)}.wallet span{font-size:8px;color:#fbbf24}
.stats{position:relative;z-index:3;display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:5px;padding:2px 8px 7px}.stat{padding:5px 3px;border-radius:9px;text-align:center;background:rgba(2,6,23,.7);border:1px solid rgba(148,163,184,.15);font-size:8px;color:#94a3b8}.stat b{display:block;font-size:clamp(11px,3.3vw,14px);color:#e2e8f0}.stat.gold{border-color:rgba(251,146,60,.4)}.stat.gold b{color:#fdba74}.stat.purple{border-color:rgba(217,70,239,.32)}.stat.purple b{color:#f0abfc}
.bonus{position:relative;z-index:3;margin:0 8px 7px;padding:6px 9px;border-radius:11px;display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,rgba(88,28,135,.25),rgba(8,47,73,.4));border:1px solid rgba(192,132,252,.22)}.bonus .label{font-size:9px;font-weight:900;color:#e9d5ff}.orbs{display:flex;gap:5px}.orb{width:19px;height:19px;border-radius:50%;background:#151225;border:1px solid rgba(216,180,254,.25)}.orb.on{background:radial-gradient(circle at 35% 30%,#fff,#f0abfc 18%,#a855f7 48%,#4c1d95);box-shadow:0 0 11px #d946ef}.bonus .mode{margin-left:auto;font-size:9px;font-weight:900;color:#f0abfc}
.frame{position:relative;z-index:3;margin:0 7px;padding:6px;border-radius:21px;background:linear-gradient(145deg,#713f12,#facc15 18%,#854d0e 39%,#fde68a 59%,#713f12);box-shadow:0 0 22px rgba(250,204,21,.15),inset 0 0 7px rgba(255,255,255,.35)}
.reelcase{position:relative;height:calc(var(--cell-h)*3);overflow:hidden;border-radius:15px;background:#020617;border:2px solid rgba(255,255,255,.17);box-shadow:inset 0 0 28px #000}.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:100%}.reel{position:relative;height:100%;overflow:hidden;background:linear-gradient(180deg,#071a2b,#0a273c 50%,#071a2b);border-right:1px solid rgba(125,211,252,.13)}.reel:last-child{border-right:0}.reel:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.58),transparent 18%,transparent 82%,rgba(0,0,0,.58))}.track{position:absolute;left:0;right:0;top:0;will-change:transform}.symbol{height:var(--cell-h);display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(148,163,184,.08);background:radial-gradient(circle,rgba(14,165,233,.08),transparent 66%)}.symbol svg{width:min(73%,72px);height:min(73%,72px);filter:drop-shadow(0 5px 5px rgba(0,0,0,.55))}.symbol.hit{background:radial-gradient(circle,rgba(254,240,138,.55),rgba(245,158,11,.19) 47%,transparent 74%);animation:pulse .3s ease-in-out infinite alternate}.center{position:absolute;z-index:6;left:0;right:0;top:var(--cell-h);height:var(--cell-h);border-top:2px solid rgba(248,113,113,.42);border-bottom:2px solid rgba(248,113,113,.42);pointer-events:none}.lines{position:absolute;z-index:9;inset:0;width:100%;height:100%;pointer-events:none}.lines path{stroke:#fde047;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 7px #f59e0b);opacity:0}.lines path.show{animation:flashline .22s linear 8}
.reach{position:absolute;z-index:25;top:45%;left:50%;transform:translate(-50%,-50%);font-size:clamp(34px,10vw,46px);font-weight:1000;letter-spacing:.1em;color:#fff;text-shadow:0 0 9px #f97316,0 0 25px #ef4444,0 4px #7c2d12;opacity:0;pointer-events:none}.reach.show{animation:reach .9s ease-out}.combo{position:absolute;z-index:25;right:12px;top:105px;padding:5px 9px;border-radius:999px;background:rgba(88,28,135,.86);border:1px solid rgba(216,180,254,.5);font-size:10px;font-weight:950;color:#f5d0fe;opacity:0}.combo.show{opacity:1;animation:pop .35s ease-out}
.banner{position:relative;z-index:3;margin:7px 8px 0;min-height:52px;padding:7px 10px;border-radius:12px;background:rgba(2,6,23,.72);border:1px solid rgba(56,189,248,.15);display:flex;justify-content:space-between;align-items:center;gap:8px}.msg{font-size:12px;font-weight:900;color:#bae6fd}.sub{font-size:8px;color:#64748b;margin-top:2px}.win{text-align:right;flex:0 0 auto}.win small{display:block;font-size:8px;color:#94a3b8}.win strong{font-size:19px;color:#fef08a}
.betpanel{position:relative;z-index:3;margin:7px 8px 0;padding:8px;border-radius:13px;background:rgba(2,6,23,.66);border:1px solid rgba(148,163,184,.14)}.bettop{display:grid;grid-template-columns:1fr 1fr;gap:7px}.betcard{padding:6px;border-radius:9px;background:rgba(15,23,42,.7);border:1px solid rgba(148,163,184,.12);font-size:8px;color:#94a3b8;text-align:center}.betcard b{display:block;font-size:15px;color:#fff}.betcard.total{border-color:rgba(251,191,36,.35)}.betcard.total b{color:#fde68a}.multipliers{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
.controls{position:relative;z-index:3;padding:8px 8px calc(11px + var(--safe-bottom))}.mainrow{display:grid;grid-template-columns:1fr 1.55fr 1fr;gap:6px}.lower{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:7px}button{min-height:44px;border-radius:13px;border:1px solid rgba(148,163,184,.2);background:#0b1c2d;color:#fff;font-weight:900;cursor:pointer;font-size:12px}button:disabled{opacity:.38;cursor:not-allowed}.multibtn{min-height:38px}.multibtn.active{background:linear-gradient(180deg,#f59e0b,#b45309);border-color:#fde68a;box-shadow:0 0 12px rgba(245,158,11,.28)}.spin{min-height:62px;font-size:clamp(21px,6vw,26px);letter-spacing:.08em;background:radial-gradient(circle at 50% 10%,#ffd35b,#f97316 55%,#c2410c);border-color:#fed7aa;box-shadow:0 6px 0 #7c2d12,0 0 22px rgba(249,115,22,.3)}.spin:active{transform:translateY(3px);box-shadow:0 3px 0 #7c2d12}.spin.fever{background:radial-gradient(circle at 50% 10%,#f0abfc,#a855f7 50%,#6b21a8);box-shadow:0 6px 0 #4c1d95,0 0 27px rgba(217,70,239,.45)}.auto.on{background:linear-gradient(180deg,#0ea5e9,#0369a1);border-color:#7dd3fc;box-shadow:0 0 15px rgba(14,165,233,.32)}
.overlay{position:absolute;z-index:60;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle,rgba(88,28,135,.76),rgba(0,0,0,.94))}.overlay.show{display:flex}.card{text-align:center;width:100%;max-width:320px}.card small{font-size:9px;letter-spacing:.28em;color:#67e8f9}.card h2{font-size:clamp(38px,11vw,48px);line-height:1;margin:8px 0 5px;font-weight:1000;color:#fff7ed;text-shadow:0 0 10px #f97316,0 0 30px #ef4444}.card h2.gameover{color:#fecaca;text-shadow:0 0 10px #dc2626,0 0 32px #7f1d1d}.card .amount{font-size:28px;font-weight:1000;color:#fde68a}.card p{font-size:11px;color:#cbd5e1;line-height:1.5}.card button{margin-top:14px;padding:0 26px;background:linear-gradient(180deg,#0ea5e9,#0369a1);border-color:#7dd3fc}.card .restart{background:linear-gradient(180deg,#ef4444,#991b1b);border-color:#fecaca}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.75)}}@keyframes flashline{0%,100%{opacity:.1}50%{opacity:1}}@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}@keyframes reach{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}@keyframes pop{0%{transform:scale(.5)}75%{transform:scale(1.14)}100%{transform:scale(1)}}
@media(max-width:360px){:root{--cell-h:76px}.header{padding-left:9px;padding-right:9px}.stats,.controls{padding-left:6px;padding-right:6px}.frame{margin-left:5px;margin-right:5px}.banner,.betpanel,.bonus{margin-left:6px;margin-right:6px}.stat{font-size:7px}.brand b{font-size:17px}.wallet strong{font-size:21px}.lower button{font-size:10px}}
@media(min-width:461px){#app{padding-top:14px;padding-bottom:14px}.machine{min-height:auto;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div id="app"><div class="machine" id="machine"><div class="bgfx"></div>
<div class="header"><div class="brand"><small>DEEP ARCADE</small><b>ABYSS SPIN</b></div><div class="wallet"><small>MY COIN</small><strong id="credit">10,000</strong><span>가상 코인</span></div></div>
<div class="stats"><div class="stat gold">GRAND<b id="grand">1,284,500</b></div><div class="stat purple">WIN STREAK<b id="streak">×1.00</b></div><div class="stat">AUTO<b id="autoleft">OFF</b></div></div>
<div class="bonus"><span class="label">BONUS</span><div class="orbs"><i class="orb" id="o0"></i><i class="orb" id="o1"></i><i class="orb" id="o2"></i></div><span class="mode" id="mode">0 / 3</span></div>
<div class="frame"><div class="reelcase"><div class="reels"><div class="reel"><div class="track" id="r0"></div></div><div class="reel"><div class="track" id="r1"></div></div><div class="reel"><div class="track" id="r2"></div></div></div><div class="center"></div><svg class="lines" viewBox="0 0 300 282" preserveAspectRatio="none"><path id="l0" d="M8 47H292"/><path id="l1" d="M8 141H292"/><path id="l2" d="M8 235H292"/><path id="l3" d="M8 47L292 235"/><path id="l4" d="M8 235L292 47"/></svg></div></div>
<div class="reach" id="reach">REACH!</div><div class="combo" id="combo">COMBO ×2</div>
<div class="banner"><div><div class="msg" id="msg">SPIN을 눌러 시작</div><div class="sub" id="sub">같은 그림 3개가 한 줄이면 당첨</div></div><div class="win"><small>WIN</small><strong id="win">0</strong></div></div>
<div class="betpanel"><div class="bettop"><div class="betcard">BASE BET<b id="basebet">100</b></div><div class="betcard total">TOTAL BET<b id="totalbet">100</b></div></div><div class="multipliers"><button class="multibtn active" data-m="1">×1</button><button class="multibtn" data-m="2">×2</button><button class="multibtn" data-m="5">×5</button><button class="multibtn" data-m="10">×10</button></div></div>
<div class="controls"><div class="mainrow"><button id="minus">BET −</button><button class="spin" id="spin">SPIN</button><button id="plus">BET +</button></div><div class="lower"><button class="auto" id="auto">AUTO 20</button><button id="sound">SOUND ON</button><button id="reset">RESET</button></div></div>
<div class="overlay" id="overlay"><div class="card"><small id="ovkick">ABYSS SPIN</small><h2 id="ovtitle">BIG WIN</h2><div class="amount" id="ovamt">+0</div><p id="ovdesc"></p><button id="ovbtn">계속</button></div></div>
</div></div>
<script>
(()=>{
const H=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-h'))||94;
const D={shark:{m:30,a:`<svg viewBox='0 0 100 100'><path d='M9 56C25 27 68 24 87 43L98 31 94 57 98 73 83 65C58 82 26 77 9 56Z' fill='#38bdf8' stroke='#dff7ff' stroke-width='2'/><path d='M50 35 64 16 69 39' fill='#0284c7'/><circle cx='74' cy='45' r='3'/></svg>`},whale:{m:20,a:`<svg viewBox='0 0 100 100'><path d='M10 54c13-27 52-31 73-12l15-9-7 17 6 14-17-7C62 79 27 78 10 54Z' fill='#60a5fa' stroke='#dbeafe' stroke-width='2'/><circle cx='72' cy='43' r='3'/></svg>`},octo:{m:12,a:`<svg viewBox='0 0 100 100'><ellipse cx='50' cy='39' rx='27' ry='24' fill='#e879f9' stroke='#fae8ff' stroke-width='2'/><circle cx='41' cy='36' r='4'/><circle cx='59' cy='36' r='4'/><path d='M25 55C9 66 17 82 30 73M39 59c-9 17 1 29 9 13M55 59c-3 20 10 27 13 8M69 54c17 7 17 23 4 22' fill='none' stroke='#e879f9' stroke-width='9' stroke-linecap='round'/></svg>`},turtle:{m:8,a:`<svg viewBox='0 0 100 100'><ellipse cx='49' cy='51' rx='27' ry='22' fill='#34d399' stroke='#d1fae5' stroke-width='2'/><path d='M29 51 49 33l20 18-20 18Z' fill='#047857'/><circle cx='80' cy='50' r='10' fill='#6ee7b7'/></svg>`},crab:{m:6,a:`<svg viewBox='0 0 100 100'><ellipse cx='50' cy='56' rx='24' ry='18' fill='#fb7185' stroke='#ffe4e6' stroke-width='2'/><circle cx='42' cy='45' r='4'/><circle cx='58' cy='45' r='4'/><path d='M28 51 14 40 8 49M72 51l14-11 6 9' fill='none' stroke='#fb7185' stroke-width='7'/></svg>`},pearl:{m:5,a:`<svg viewBox='0 0 100 100'><path d='M16 68Q18 23 50 23t34 45Q67 84 50 84T16 68Z' fill='#fb7185' stroke='#ffe4e6' stroke-width='2'/><circle cx='50' cy='60' r='14' fill='#fff7ed'/></svg>`},wild:{m:0,a:`<svg viewBox='0 0 100 100'><circle cx='50' cy='50' r='37' fill='#f59e0b' stroke='#fff7ed' stroke-width='3'/><text x='50' y='57' text-anchor='middle' font-size='17' font-weight='900' fill='white'>WILD</text></svg>`},bonus:{m:0,a:`<svg viewBox='0 0 100 100'><circle cx='50' cy='50' r='36' fill='#9333ea' stroke='#f5d0fe' stroke-width='3'/><text x='50' y='57' text-anchor='middle' font-size='14' font-weight='900' fill='white'>BONUS</text></svg>`}};
const K=Object.keys(D),W=[4,7,10,13,16,19,6,4];
const q=s=>document.querySelector(s),reels=[q('#r0'),q('#r1'),q('#r2')];
let credit=10000,baseBet=100,mult=1,bonus=0,fever=0,streak=0,grand=1284500,spinning=false,soundOn=true,audio=null,autoRemaining=0,autoTimer=null,gameOver=false,spinNo=0;
let board=[['pearl','whale','turtle'],['crab','octo','pearl'],['turtle','shark','crab']];
const demo=[[['pearl','whale','turtle'],['crab','octo','pearl'],['turtle','shark','crab']],[['turtle','shark','crab'],['pearl','shark','turtle'],['octo','shark','pearl']],[['bonus','crab','pearl'],['turtle','octo','shark'],['pearl','whale','crab']],[['shark','octo','pearl'],['shark','crab','turtle'],['shark','whale','octo']],[['crab','turtle','pearl'],['bonus','whale','shark'],['octo','pearl','crab']],[['octo','wild','octo'],['octo','crab','octo'],['octo','wild','octo']],[['turtle','crab','bonus'],['pearl','octo','shark'],['whale','turtle','crab']],[['wild','shark','wild'],['shark','shark','shark'],['wild','shark','wild']]];
const totalBet=()=>baseBet*mult,fmt=n=>Math.max(0,Math.floor(n)).toLocaleString('ko-KR');
function pick(){let t=W.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<W.length;i++){r-=W[i];if(r<=0)return K[i]}return'pearl'}
function sym(k){return `<div class='symbol' data-k='${k}'>${D[k].a}</div>`}
function staticReel(i,a){reels[i].style.transition='none';reels[i].style.transform='translateY(0)';reels[i].innerHTML=a.map(sym).join('')}
function streakMult(){if(streak<=1)return 1;if(streak===2)return 1.25;if(streak===3)return 1.5;if(streak===4)return 2;return 3}
function update(){q('#credit').textContent=fmt(credit);q('#grand').textContent=fmt(grand);q('#basebet').textContent=fmt(baseBet);q('#totalbet').textContent=fmt(totalBet());q('#streak').textContent='×'+streakMult().toFixed(2);q('#autoleft').textContent=autoRemaining>0?autoRemaining:'OFF';q('#mode').textContent=fever>0?'FREE '+fever+' SPIN':bonus+' / 3';for(let i=0;i<3;i++)q('#o'+i).classList.toggle('on',i<bonus);q('#machine').classList.toggle('fever',fever>0);q('#spin').classList.toggle('fever',fever>0);q('#auto').classList.toggle('on',autoRemaining>0);q('#auto').textContent=autoRemaining>0?'AUTO STOP':'AUTO 20';document.querySelectorAll('.multibtn').forEach(b=>b.classList.toggle('active',Number(b.dataset.m)===mult))}
function render(){for(let i=0;i<3;i++)staticReel(i,board[i]);update()}
function actx(){if(!soundOn)return null;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch(e){return null}}
function tone(f,d=.08,type='sine',v=.04,delay=0){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function shake(){const m=q('#machine');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake')}
function reach(){const e=q('#reach');e.classList.remove('show');void e.offsetWidth;e.classList.add('show');[220,330,440,660].forEach((f,i)=>tone(f,.13,'sawtooth',.035,i*.1))}
function strip(fin){const a=[];for(let i=0;i<34;i++)a.push(pick());return a.concat(fin)}
function spinReel(i,fin,dur){return new Promise(res=>{const e=reels[i],s=strip(fin),h=H();e.style.transition='none';e.style.transform='translateY(0)';e.innerHTML=s.map(sym).join('');void e.offsetHeight;const end=-(s.length-3)*h;e.style.transition='transform 150ms cubic-bezier(.6,0,1,.5)';e.style.transform=`translateY(${-h*5}px)`;setTimeout(()=>{const rem=Math.max(350,dur-430);e.style.transition=`transform ${rem}ms linear`;e.style.transform=`translateY(${end+h*2}px)`;setTimeout(()=>{e.style.transition='transform 260ms cubic-bezier(.05,.8,.17,1)';e.style.transform=`translateY(${end}px)`;setTimeout(()=>{staticReel(i,fin);tone(150+i*45,.06,'square',.035);res()},270)},rem)},155)})}
function clearFx(){document.querySelectorAll('.symbol.hit').forEach(x=>x.classList.remove('hit'));document.querySelectorAll('.lines path').forEach(x=>x.classList.remove('show'));q('#combo').classList.remove('show')}
function match(rows){const vals=rows.map((row,r)=>board[r][row]),target=vals.find(v=>v!=='wild'&&v!=='bonus');if(!target)return vals.every(v=>v==='wild')?{ok:true,key:'shark'}:{ok:false};if(vals.includes('bonus'))return{ok:false};return{ok:vals.every(v=>v===target||v==='wild'),key:target}}
function mark(rows,idx){rows.forEach((row,r)=>{const el=reels[r].children[row];if(el)el.classList.add('hit')});q('#l'+idx).classList.add('show')}
function multiMult(h){return h<=1?1:h===2?1.5:h===3?2:3}
function countUp(n){const st=performance.now(),dur=Math.min(1200,450+n/15);function f(t){const p=Math.min(1,(t-st)/dur);q('#win').textContent=fmt(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function showOverlay(title,amt,desc,kick='ABYSS SPIN',restart=false){q('#ovkick').textContent=kick;q('#ovtitle').textContent=title;q('#ovtitle').classList.toggle('gameover',restart);q('#ovamt').textContent=amt;q('#ovdesc').textContent=desc;q('#ovbtn').textContent=restart?'RESTART':'계속';q('#ovbtn').className=restart?'restart':'';q('#ovbtn').dataset.restart=restart?'1':'0';q('#overlay').classList.add('show')}
function checkGameOver(){if(fever>0)return false;if(credit<50){gameOver=true;autoRemaining=0;clearTimeout(autoTimer);update();showOverlay('GAME OVER','COIN '+fmt(credit),'최저 베팅 50 코인도 낼 수 없어 게임 종료.','ABYSS CLOSED',true);return true}return false}
function addBonus(){if(board.flat().includes('bonus')){bonus=Math.min(3,bonus+1);q('#msg').textContent='BONUS ORB GET!';q('#sub').textContent=bonus+'/3 — 3개면 FREE FEVER';tone(880,.15,'triangle',.05);if(bonus>=3){bonus=0;fever=5;setTimeout(()=>showOverlay('SEA FEVER','FREE ×5','다음 5스핀은 코인 차감 없음 + 당첨 배당 ×2','BONUS COMPLETE'),250)}}}
function evaluate(){clearFx();const lines=[[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]];let raw=0,hits=0;lines.forEach((rows,idx)=>{const m=match(rows);if(m.ok){hits++;raw+=totalBet()*D[m.key].m;mark(rows,idx)}});if(hits){streak++;const sm=streakMult(),mm=multiMult(hits),fm=fever>0?2:1,total=Math.floor(raw*sm*mm*fm);credit+=total;q('#msg').textContent=hits>=3?'FULL SEA COMBO!':hits===2?'DOUBLE LINE!':'PAYLINE HIT!';q('#sub').textContent='BET ×'+mult+' · 연승 ×'+sm.toFixed(2)+' · 라인 ×'+mm.toFixed(2)+(fever>0?' · FEVER ×2':'');q('#combo').textContent='COMBO ×'+sm.toFixed(2);q('#combo').classList.add('show');shake();countUp(total);[523,659,784].forEach((f,i)=>tone(f,.17,'triangle',.05,i*.08));if(total>=totalBet()*45)setTimeout(()=>showOverlay(total>=totalBet()*100?'MEGA WIN':'BIG WIN','+'+fmt(total),q('#sub').textContent,'COMBO PAYOUT'),350)}else{streak=0;q('#win').textContent='0';q('#msg').textContent='MISS';q('#sub').textContent='-'+fmt(totalBet())+' COIN'}addBonus();grand+=Math.max(1,Math.floor(totalBet()*.03));update()}
function nextBoard(){if(spinNo<demo.length)return demo[spinNo];return [[pick(),pick(),pick()],[pick(),pick(),pick()],[pick(),pick(),pick()]]}
function scheduleAuto(){if(autoRemaining<=0||spinning||q('#overlay').classList.contains('show')||gameOver)return;clearTimeout(autoTimer);autoTimer=setTimeout(()=>spin(),650)}
async function spin(){if(spinning||gameOver)return;const cost=totalBet();if(fever<=0&&credit<cost){if(credit<50){checkGameOver();return}q('#msg').textContent='코인이 부족해';q('#sub').textContent='BET/배수를 낮춰 · 필요 '+fmt(cost)+' / 보유 '+fmt(credit);autoRemaining=0;update();return}actx();spinning=true;q('#spin').disabled=true;q('#minus').disabled=true;q('#plus').disabled=true;clearFx();q('#win').textContent='0';board=nextBoard();const freeSpin=fever>0;if(!freeSpin)credit-=cost;update();q('#msg').textContent=freeSpin?'FREE FEVER SPIN!':'-'+fmt(cost)+' COIN · SPIN';q('#sub').textContent='BASE '+fmt(baseBet)+' × '+mult;const likely=board[0][1]===board[1][1]||board[0][1]==='wild'||board[1][1]==='wild';const p0=spinReel(0,board[0],720),p1=spinReel(1,board[1],1040),p2=spinReel(2,board[2],likely?2150:1400);await p0;await p1;if(likely)reach();await p2;evaluate();spinNo++;if(freeSpin)fever=Math.max(0,fever-1);if(autoRemaining>0)autoRemaining--;spinning=false;q('#spin').disabled=false;q('#minus').disabled=false;q('#plus').disabled=false;update();if(!checkGameOver()&&autoRemaining>0&&!q('#overlay').classList.contains('show'))scheduleAuto()}
function restart(){credit=10000;baseBet=100;mult=1;bonus=0;fever=0;streak=0;spinNo=0;autoRemaining=0;gameOver=false;q('#win').textContent='0';q('#msg').textContent='새 게임 시작';q('#sub').textContent='보유 코인 10,000';board=[['pearl','whale','turtle'],['crab','octo','pearl'],['turtle','shark','crab']];q('#overlay').classList.remove('show');render()}
q('#spin').addEventListener('click',()=>{if(autoRemaining>0){autoRemaining=0;clearTimeout(autoTimer);update()}spin()});q('#auto').addEventListener('click',()=>{if(gameOver)return;if(autoRemaining>0){autoRemaining=0;clearTimeout(autoTimer);q('#msg').textContent='AUTO STOP';update();return}autoRemaining=20;update();scheduleAuto()});q('#minus').addEventListener('click',()=>{if(!spinning&&!autoRemaining){baseBet=Math.max(50,baseBet-50);update()}});q('#plus').addEventListener('click',()=>{if(!spinning&&!autoRemaining){baseBet=Math.min(1000,baseBet+50);update()}});document.querySelectorAll('.multibtn').forEach(b=>b.addEventListener('click',()=>{if(spinning||autoRemaining)return;mult=Number(b.dataset.m);update();if(totalBet()>credit&&credit>=50){q('#msg').textContent='현재 코인보다 큰 베팅';q('#sub').textContent='배수 또는 BASE BET을 낮춰'}}));q('#sound').addEventListener('click',()=>{soundOn=!soundOn;q('#sound').textContent=soundOn?'SOUND ON':'SOUND OFF';if(soundOn){actx();tone(660,.08,'sine',.04)}});q('#reset').addEventListener('click',restart);q('#ovbtn').addEventListener('click',()=>{if(q('#ovbtn').dataset.restart==='1')restart();else{q('#overlay').classList.remove('show');scheduleAuto()}});render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
